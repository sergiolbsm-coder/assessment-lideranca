<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrevista de Alto Impacto · Relatório</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Cormorant+Garamond:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="bg"></div>
<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img class="logo-mark" src="logo.svg" alt="Entrevista de Alto Impacto">
      <div>
        <div class="brand-name">Entrevista de Alto Impacto</div>
        <div class="brand-sub"><img class="idealizadora-avatar" src="franciane-novais.jpg" alt="Franciane Novais">Idealizadora <b>Franciane Novais</b><br>Venture desenvolvida em parceria com o Instituto da Liderança</div>
      </div>
    </a>
    <div class="tabs" id="tabs"></div>
  </div>
</div>
<div id="app"></div>
<div id="toast-host"></div>
<script src="app.js"></script>
<script>
"use strict";
renderNav('relatorio');
const INTERVIEW_ID = qs('id');

async function boot(){
  document.getElementById('app').innerHTML = loadingHtml('Carregando relatório…');
  try{
    if(!INTERVIEW_ID){
      // Lista de todos os relatórios: só com login. O relatório individual
      // abre pelo link do candidato, sem login.
      if(!(await requireRole(['especialista','recrutadora','admin'], 'Relatórios'))) return;
      await renderPicker(); return;
    }
    const interview = await Api.getInterview(INTERVIEW_ID);
    if(!interview){ document.getElementById('app').innerHTML = '<div class="wrap"><div class="empty">Relatório não encontrado.</div></div>'; return; }
    renderReport(interview);
  }catch(err){
    document.getElementById('app').innerHTML = errorHtml(err);
  }
}

async function renderPicker(){
  const app = document.getElementById('app');
  app.innerHTML = loadingHtml('Carregando…');
  let rows = [];
  try{ rows = await Api.listInterviews(); }
  catch(err){ app.innerHTML = errorHtml(err); return; }

  rows.sort(function(a,b){ return new Date(b.createdAt) - new Date(a.createdAt); });
  const listHtml = rows.length ? rows.map(function(i){
    const st = STATUS_META[i.status]||{};
    return '<a class="list-row" href="relatorio.html?id='+encodeURIComponent(i.id)+'">'+
      '<div><div class="name">'+esc(i.candidateName)+'</div><div class="sub">'+(i.targetRole?esc(i.targetRole)+' · ':'')+fmtDate(i.createdAt)+'</div></div>'+
      '<div class="spacer"></div><span class="badge '+st.cls+'">'+st.label+'</span></a>';
  }).join('') : '<div class="empty">Nenhuma simulação registrada ainda.</div>';

  app.innerHTML =
    '<div class="wrap wrap-wide">'+
      '<h2>Relatórios</h2>'+
      '<p class="hint">Selecione uma simulação para ver o relatório completo e imprimir ou salvar em PDF.</p>'+
      '<div class="divider"></div>'+
      listHtml+
    '</div>';
}

// Status da vaga, mensagem e sugestões da recrutadora (o backend só envia
// esses campos ao candidato depois que o e-mail foi enviado).
function recruiterBlockHtml(i){
  if(!i.jobStatus && !i.recruiterMessage && !i.improvementSuggestions) return '';
  return '<div class="overall-note" style="margin-bottom:16px">'+
    (i.jobStatus && JOB_STATUS[i.jobStatus] ? '<div class="lbl mono" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--idl-text-muted)">Status da vaga</div><p style="font-size:16px;font-weight:700;margin:4px 0 14px;color:var(--idl-purple-dark)">'+esc(JOB_STATUS[i.jobStatus])+'</p>' : '')+
    (i.recruiterMessage ? '<div class="res-block" style="margin-top:0"><div class="lbl">Mensagem'+(i.recruiterName?' de '+esc(i.recruiterName):' da recrutadora')+'</div><p>'+nl2br(i.recruiterMessage)+'</p></div>' : '')+
    (i.improvementSuggestions ? '<div class="res-block orient"><div class="lbl">Pontos fortes e sugestões de melhoria</div><p>'+nl2br(i.improvementSuggestions)+'</p></div>' : '')+
    '</div>';
}

function renderReport(interview){
  const app = document.getElementById('app');
  const snap = interview.questionsSnapshot;
  const ai = interview.aiFeedback || {};
  const spec = (interview.specialistFeedback && interview.specialistFeedback.byQuestion) || {};
  const overall = (interview.specialistFeedback && interview.specialistFeedback.overall) || null;

  const cards = snap.map(function(q, i){
    const ans = (interview.answers[q.qid] && interview.answers[q.qid].text) || '';
    const meta = TIPO_META[q.tipo] || TIPO_META.direta;
    const aiText = (ai.byQuestion && ai.byQuestion[q.qid]) || (ai.status==='pending' ? 'Em geração…' : (ai.status==='unavailable' ? 'Indisponível' : '-'));
    const specEntry = spec[q.qid];
    return '<div class="rescard">'+
      '<div class="qn">Pergunta '+(i+1)+' de '+snap.length+' · <span class="badge muted" style="margin-left:4px">'+esc(meta.short)+'</span></div>'+
      '<h3>'+esc(q.text)+'</h3>'+
      '<div class="res-block answer"><div class="lbl">Resposta do candidato</div><p>'+nl2br(ans||'(em branco)')+'</p></div>'+
      '<div class="res-block orient"><div class="lbl">💡 Como responder melhor</div><p>'+nl2br(q.orientacao||'-')+'</p>'+
        (q.tipo==='star'?starLegendHtml():'')+
      '</div>'+
      '<div class="res-block ai"><div class="lbl">🤖 Feedback automático da IA</div><p>'+nl2br(aiText)+'</p></div>'+
      '<div class="res-block specialist"><div class="lbl">🧑‍🏫 Feedback da especialista'+(specEntry?(' · '+esc(specEntry.specialistName)):'')+'</div><p>'+
        (specEntry?nl2br(specEntry.text):'Aguardando avaliação da especialista.')+'</p></div>'+
    '</div>';
  }).join('');

  const st = STATUS_META[interview.status]||{};
  app.innerHTML =
    '<div id="s-report" class="wrap">'+
      '<div class="report-hero">'+
        '<img class="logo-mark" src="logo.svg" alt="Entrevista de Alto Impacto">'+
        '<div class="report-brand">Entrevista de Alto Impacto</div>'+
        '<div class="report-idealizadora"><img class="idealizadora-avatar-lg" src="franciane-novais.jpg" alt="Franciane Novais">Idealizadora <b>Franciane Novais</b></div>'+
        '<div class="report-tagline">Venture desenvolvida em parceria com o Instituto da Liderança</div>'+
        '<div class="report-name">'+esc(interview.candidateName)+'</div>'+
        '<div class="report-meta">'+(interview.targetRole?esc(interview.targetRole)+' · ':'')+(interview.kind==='ao_vivo'?'Entrevista ao vivo':'Simulação de entrevista')+' · '+fmtDate(interview.createdAt)+'</div>'+
        '<span class="badge '+st.cls+'" style="margin-top:10px">'+st.label+'</span>'+
      '</div>'+
      recruiterBlockHtml(interview)+
      cards+
      (overall ? '<div class="overall-note"><div class="res-block specialist" style="background:none;padding:0"><div class="lbl">🧑‍🏫 Síntese geral da especialista · '+esc(overall.specialistName)+'</div><p>'+nl2br(overall.text)+'</p></div></div>' : '')+
      '<div class="nav-row noprint"><a class="btn-secondary" href="relatorio.html">← Todos os relatórios</a><button class="btn-primary" onclick="window.print()">Imprimir / salvar PDF</button></div>'+
    '</div>';
}

boot();
</script>
</body>
</html>
