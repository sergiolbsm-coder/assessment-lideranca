<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrevista de Alto Impacto · Minha conta</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Cormorant+Garamond:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=202610052039">
</head>
<body>
<div class="bg"></div>
<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img class="logo-mark" src="logo.svg" alt="Entrevista de Alto Impacto">
      <div>
        <div class="brand-name">Entrevista de Alto Impacto</div>
        <div class="brand-sub"><img class="idealizadora-avatar" src="franciane-novais.jpg" alt="Franciane Novais">Idealizadora <b>Franciane Novais</b><br>Venture desenvolvida em parceria com o Instituto da Liderança</div>
      </div>
    </a>
    <div class="tabs" id="tabs"></div>
  </div>
</div>
<div id="app"></div>
<div id="toast-host"></div>
<script src="app.js?v=202610052039"></script>
<script>
"use strict";
renderNav('conta');

let perfil = null, minhas = [];

async function boot(){
  const app = document.getElementById('app');
  const auth = getAuth();
  if(!auth || auth.role !== 'respondente'){
    app.innerHTML = '<div class="wrap"><div class="card" style="max-width:420px;margin:30px auto;text-align:center"><h2 style="font-size:24px">Minha conta</h2>'+
      '<p class="hint" style="margin:8px 0 18px">Entre ou crie uma conta de participante para ver o seu perfil e as suas simulações.</p>'+
      '<a class="btn-primary" style="display:block" href="responder.html">Criar conta ou entrar</a></div></div>';
    return;
  }
  app.innerHTML = loadingHtml('Carregando seu perfil…');
  try{
    const r = await Api.me(); perfil = r.profile; minhas = r.interviews || [];
    render();
  }catch(err){ app.innerHTML = errorHtml(err); }
}

function render(){
  const app = document.getElementById('app');
  const lista = minhas.slice().sort(function(a,b){ return new Date(b.createdAt) - new Date(a.createdAt); }).map(function(i){
    const st = STATUS_META[i.status] || {label:i.status, cls:'muted'};
    const andamento = i.status === 'em_andamento';
    return '<div class="list-row" style="cursor:default">'+
      '<div><div class="name">'+esc(i.blockName || 'Simulação')+(i.targetRole?' · '+esc(i.targetRole):'')+'</div>'+
      '<div class="sub">'+fmtDate(i.createdAt)+'</div></div><div class="spacer"></div>'+
      '<span class="badge '+st.cls+'">'+st.label+'</span>'+
      '<a class="btn-secondary" href="responder.html?id='+encodeURIComponent(i.id)+'">'+(andamento?'Continuar':'Ver resultado')+'</a>'+
      (andamento?'':'<a class="btn-secondary" href="relatorio.html?id='+encodeURIComponent(i.id)+'">Relatório</a>')+
    '</div>';
  }).join('') || '<div class="empty">Você ainda não fez nenhuma simulação.</div>';

  app.innerHTML =
    '<div class="wrap wrap-wide">'+
      '<div class="section-title"><h2>Olá, '+esc((perfil.name||'').split(' ')[0])+'</h2><a class="btn-primary" href="responder.html">Nova simulação</a></div>'+
      '<h3 style="font-size:20px;margin:6px 0 12px">Minhas simulações</h3>'+lista+
      '<div class="divider"></div>'+
      '<h3 style="font-size:20px;margin-bottom:12px">Meu perfil</h3>'+
      '<form class="card form-grid" id="f-perfil">'+
        '<div class="field full"><label>Nome completo</label><input id="p-nome" value="'+esc(perfil.name)+'" required></div>'+
        '<div class="field"><label>E-mail (não pode ser alterado)</label><input value="'+esc(perfil.email)+'" disabled></div>'+
        '<div class="field"><label>Telefone</label><input id="p-tel" value="'+esc(perfil.phone)+'"></div>'+
        '<div class="field"><label>LinkedIn</label><input id="p-linkedin" value="'+esc(perfil.linkedin)+'"></div>'+
        '<div class="field"><label>Instagram</label><input id="p-insta" value="'+esc(perfil.instagram)+'"></div>'+
        '<div class="field"><label>Empresa</label><input id="p-empresa" value="'+esc(perfil.company)+'"></div>'+
        '<div class="field"><label>Cargo / função pretendida</label><input id="p-cargo" value="'+esc(perfil.role)+'"></div>'+
        '<div class="full"><button class="btn-primary" id="p-btn" type="submit">Salvar perfil</button></div>'+
      '</form>'+
    '</div>';
  document.getElementById('f-perfil').addEventListener('submit', salvarPerfil);
}

async function salvarPerfil(ev){
  ev.preventDefault();
  const v = function(id){ return document.getElementById(id).value.trim(); }, btn = document.getElementById('p-btn');
  const novo = {name:v('p-nome'), phone:v('p-tel'), linkedin:v('p-linkedin'), instagram:v('p-insta'), company:v('p-empresa'), role:v('p-cargo')};
  btn.disabled = true; btn.textContent = 'Salvando…';
  try{
    await Api.post('updateProfile', novo);
    const r = await Api.me();   // o envio não devolve resposta: confere no servidor
    const ok = r.profile.name === novo.name && r.profile.company === novo.company && r.profile.role === novo.role;
    if(ok){ perfil = r.profile; const a = getAuth(); if(a){ a.name = perfil.name; lsSet(AUTH_KEY, a); renderNav('conta'); } toast('Perfil salvo.'); }
    else toast('Não foi possível salvar. Sua sessão pode ter expirado: entre de novo.');
  }catch(err){ toast('Erro: '+err.message); }
  btn.disabled = false; btn.textContent = 'Salvar perfil';
}

boot();
</script>
</body>
</html>
