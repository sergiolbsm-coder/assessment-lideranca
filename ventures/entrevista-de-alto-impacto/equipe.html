<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrevista de Alto Impacto · Acesso da equipe</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Cormorant+Garamond:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=202610052039">
</head>
<body>
<div class="bg"></div>
<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img class="logo-mark" src="logo.svg" alt="Entrevista de Alto Impacto">
      <div>
        <div class="brand-name">Entrevista de Alto Impacto</div>
        <div class="brand-sub"><img class="idealizadora-avatar" src="franciane-novais.jpg" alt="Franciane Novais">Idealizadora <b>Franciane Novais</b><br>Venture desenvolvida em parceria com o Instituto da Liderança</div>
      </div>
    </a>
    <div class="tabs" id="tabs"></div>
  </div>
</div>
<div id="app"></div>
<div id="toast-host"></div>
<script src="app.js?v=202610052039"></script>
<script>
"use strict";
renderNav('');

const DESTINO = {especialista:'especialista.html', recrutadora:'recrutadora.html', admin:'admin.html'};
const ROTULO = {especialista:'Especialista', recrutadora:'Recrutadora', admin:'Administrador'};

function render(){
  const app = document.getElementById('app');
  const auth = getAuth();
  if(auth){
    app.innerHTML = '<div class="wrap"><div class="card" style="max-width:380px;margin:30px auto;text-align:center">'+
      '<h2 style="font-size:24px">Você já está conectada</h2>'+
      '<p class="hint" style="margin:8px 0 18px">Perfil: '+esc(ROTULO[auth.role]||auth.role)+'</p>'+
      '<a class="btn-primary" style="display:block" href="'+(DESTINO[auth.role]||'index.html')+'">Continuar</a>'+
      '<button class="btn-secondary" style="margin-top:10px;width:100%" onclick="logout()">Sair</button></div></div>';
    return;
  }
  const perfis = ['especialista'].concat(FEATURES.recrutadora ? ['recrutadora'] : []).concat(['admin']);
  app.innerHTML =
    '<div class="wrap"><div class="card" style="max-width:380px;margin:30px auto">'+
      '<h2 style="font-size:24px">Acesso da equipe</h2>'+
      '<p class="hint" style="margin-bottom:18px">Área restrita à equipe. Entre com o usuário e a senha que você recebeu.</p>'+
      '<form id="login-form">'+
        '<div class="field"><label>Perfil</label><select id="lg-role">'+perfis.map(function(p){ return '<option value="'+p+'">'+ROTULO[p]+'</option>'; }).join('')+'</select></div>'+
        '<div class="field"><label>Usuário</label><input id="lg-user" autocomplete="username" autocapitalize="none" required></div>'+
        '<div class="field"><label>Senha</label><input id="lg-pass" type="password" autocomplete="current-password" required></div>'+
        '<button class="btn-primary" id="lg-btn" type="submit" style="width:100%">Entrar</button>'+
        '<p class="hint" id="lg-msg" style="margin-top:12px;min-height:18px"></p>'+
      '</form></div></div>';
  document.getElementById('lg-user').focus();
  document.getElementById('login-form').addEventListener('submit', async function(ev){
    ev.preventDefault();
    const role = document.getElementById('lg-role').value, btn = document.getElementById('lg-btn'), msg = document.getElementById('lg-msg');
    btn.disabled = true; btn.textContent = 'Entrando…'; msg.textContent = '';
    try{
      await Api.login(role, document.getElementById('lg-user').value, document.getElementById('lg-pass').value);
      location.href = DESTINO[role];
    }catch(err){
      msg.textContent = (err.message === 'CONFIG') ? 'Backend não configurado.' : err.message;
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  });
}
render();
</script>
</body>
</html>
