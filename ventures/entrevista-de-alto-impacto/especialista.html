<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrevista de Alto Impacto · Especialista</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Cormorant+Garamond:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=202610052039">
</head>
<body>
<div class="bg"></div>
<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img class="logo-mark" src="logo.svg" alt="Entrevista de Alto Impacto">
      <div>
        <div class="brand-name">Entrevista de Alto Impacto</div>
        <div class="brand-sub"><img class="idealizadora-avatar" src="franciane-novais.jpg" alt="Franciane Novais">Idealizadora <b>Franciane Novais</b><br>Venture desenvolvida em parceria com o Instituto da Liderança</div>
      </div>
    </a>
    <div class="tabs" id="tabs"></div>
  </div>
</div>
<div id="app"></div>
<div id="toast-host"></div>
<script src="app.js?v=202610052039"></script>
<script>
"use strict";
renderNav('especialista');
const INTERVIEW_ID = qs('id');
let currentInterview = null;

async function boot(){
  document.getElementById('app').innerHTML = loadingHtml('Carregando…');
  try{
    if(!(await requireRole(['especialista','admin'], 'Área da especialista'))) return;
    if(!INTERVIEW_ID){ await renderList(); return; }
    const interview = await Api.getInterview(INTERVIEW_ID);
    if(!interview){ document.getElementById('app').innerHTML = '<div class="wrap"><div class="empty">Simulação não encontrada.</div></div>'; return; }
    currentInterview = interview;
    renderDetail();
  }catch(err){
    document.getElementById('app').innerHTML = errorHtml(err);
  }
}

let _todas = [];
function linhaHtml(i){
  const st = STATUS_META[i.status]||{label:i.status, cls:'muted'};
  const quando = i.submittedAt ? 'enviada em '+fmtDate(i.submittedAt) : 'criada em '+fmtDate(i.createdAt);
  return '<a class="list-row" href="especialista.html?id='+encodeURIComponent(i.id)+'">'+
    '<div><div class="name">'+esc(i.candidateName)+'</div><div class="sub">'+
      [i.blockName, i.targetRole, i.candidateEmail].filter(Boolean).map(esc).join(' · ')+(i.blockName||i.targetRole||i.candidateEmail?' · ':'')+quando+'</div></div>'+
    '<div class="spacer"></div><span class="badge '+st.cls+'">'+st.label+'</span></a>';
}
function filtraLista(){
  const t = (document.getElementById('busca').value||'').trim().toLowerCase(), st = document.getElementById('f-status').value;
  const rows = _todas.filter(function(i){
    if(st && i.status !== st) return false;
    return !t || [i.candidateName, i.candidateEmail, i.targetRole, i.blockName].join(' ').toLowerCase().indexOf(t) > -1;
  });
  document.getElementById('lista').innerHTML = rows.length ? rows.map(linhaHtml).join('') : '<div class="empty">Nenhuma simulação encontrada.</div>';
  document.getElementById('conta').textContent = rows.length + ' de ' + _todas.length + ' simulações';
}

async function renderList(){
  const app = document.getElementById('app');
  app.innerHTML = loadingHtml('Carregando simulações…');
  try{ _todas = await Api.listInterviews(); }
  catch(err){ app.innerHTML = errorHtml(err); return; }
  // Todas as simulações registradas, de qualquer respondente (com ou sem conta).
  _todas.sort(function(a,b){ return new Date(b.submittedAt||b.createdAt) - new Date(a.submittedAt||a.createdAt); });

  app.innerHTML =
    '<div class="wrap wrap-wide">'+
      '<div class="section-title"><h2>Simulações</h2>'+
        '<button class="btn-secondary" onclick="location.reload()">Atualizar lista</button></div>'+
      '<div class="field" style="max-width:320px"><label>Seu nome (aparece no feedback salvo)</label>'+
        '<input id="esp-nome" value="'+esc(specialistName())+'" placeholder="Ex: Ana Souza" onchange="setSpecialistName(this.value.trim())"></div>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px">'+
        '<input id="busca" placeholder="Buscar por nome, e-mail, vaga ou bloco…" oninput="filtraLista()" style="flex:1;min-width:220px">'+
        '<select id="f-status" onchange="filtraLista()" style="width:auto"><option value="">Todos os status</option>'+
          Object.keys(STATUS_META).map(function(k){ return '<option value="'+k+'">'+STATUS_META[k].label+'</option>'; }).join('')+'</select></div>'+
      '<p class="hint" id="conta"></p>'+
      '<div class="divider"></div><div id="lista"></div>'+
    '</div>';
  filtraLista();
}

function renderDetail(){
  const app = document.getElementById('app');
  const interview = currentInterview;
  const snap = interview.questionsSnapshot;
  const ai = interview.aiFeedback || {};
  const spec = (interview.specialistFeedback && interview.specialistFeedback.byQuestion) || {};
  const overall = (interview.specialistFeedback && interview.specialistFeedback.overall) || null;

  const cards = snap.map(function(q, i){
    const ans = (interview.answers[q.qid] && interview.answers[q.qid].text) || '';
    const meta = TIPO_META[q.tipo] || TIPO_META.direta;
    const aiText = (ai.byQuestion && ai.byQuestion[q.qid]) || (ai.status==='pending' ? 'Gerando…' : (ai.status==='unavailable'?'Indisponível':'-'));
    const specEntry = spec[q.qid];
    return '<div class="rescard">'+
      '<div class="qn">Pergunta '+(i+1)+' de '+snap.length+' · <span class="badge muted" style="margin-left:4px">'+esc(meta.short)+'</span></div>'+
      '<h3>'+esc(q.text)+'</h3>'+
      '<div class="res-block answer"><div class="lbl">Resposta do candidato</div><p>'+nl2br(ans||'(em branco)')+'</p></div>'+
      '<div class="res-block ai"><div class="lbl">🤖 Feedback automático da IA</div><p id="ai-q-'+q.qid+'">'+nl2br(aiText)+'</p></div>'+
      '<div class="field" style="margin-top:14px"><label>Seu feedback para esta pergunta</label>'+
        '<textarea id="sf-'+q.qid+'" rows="3" placeholder="Escreva um feedback específico…">'+esc(specEntry?specEntry.text:'')+'</textarea>'+
        '<button class="btn-primary" style="margin-top:8px" onclick="Especialista.saveOne(\''+q.qid+'\')">Salvar feedback</button>'+
      '</div>'+
    '</div>';
  }).join('');

  const st = STATUS_META[interview.status]||{};
  app.innerHTML =
    '<div class="wrap">'+
      '<a class="btn-ghost" href="especialista.html">← Voltar à lista</a>'+
      '<div class="section-title"><h2>'+esc(interview.candidateName)+'</h2><span class="badge '+st.cls+'">'+st.label+'</span></div>'+
      '<p class="hint">'+(interview.targetRole?esc(interview.targetRole)+' · ':'')+'enviado em '+fmtDate(interview.submittedAt)+'</p>'+
      contactHtml(interview)+
      '<div id="ai-banner">'+aiBannerHtml(ai)+'</div>'+
      '<div class="divider"></div>'+
      cards+
      '<div class="card">'+
        '<div class="field"><label>Comentário geral (opcional)</label><textarea id="sf-overall" rows="3" placeholder="Uma síntese da entrevista como um todo…">'+esc(overall?overall.text:'')+'</textarea></div>'+
        '<button class="btn-secondary" onclick="Especialista.saveOverall()">Salvar comentário geral</button>'+
      '</div>'+
      '<div class="nav-row">'+
        (interview.status==='avaliado' ?
          '<button class="btn-secondary" onclick="Especialista.reopen()">Reabrir avaliação</button>' :
          '<button class="btn-primary" onclick="Especialista.complete()">Marcar avaliação como concluída</button>')+
        '<a class="btn-secondary" style="display:inline-block;text-align:center" href="relatorio.html?id='+encodeURIComponent(interview.id)+'">Ver relatório →</a>'+
      '</div>'+
    '</div>';
}

function refreshAi(){
  var ai = currentInterview.aiFeedback || {};
  var b = document.getElementById('ai-banner');
  if(b) b.innerHTML = aiBannerHtml(ai);
  currentInterview.questionsSnapshot.forEach(function(q){
    var el = document.getElementById('ai-q-'+q.qid);
    if(!el) return;
    el.textContent = (ai.byQuestion && ai.byQuestion[q.qid]) || (ai.status==='pending' ? 'Gerando…' : (ai.status==='unavailable' ? 'Indisponível' : '-'));
  });
}

// Contato de quem respondeu (só a equipe vê). Links só para http(s), para
// nunca montar um link perigoso a partir do que a pessoa digitou.
function safeUrl(v, base){
  v = String(v||'').trim(); if(!v) return '';
  if(/^https?:\/\//i.test(v)) return v;
  if(base && /^[\w.\-\/]+$/.test(v.replace(/^@/,''))) return base + v.replace(/^@/,'');
  return '';
}
function contactHtml(i){
  var parts = [];
  if(i.candidateEmail) parts.push('<a href="mailto:'+esc(i.candidateEmail)+'">'+esc(i.candidateEmail)+'</a>');
  if(i.candidatePhone) parts.push('<a href="tel:'+esc(String(i.candidatePhone).replace(/[^\d+]/g,''))+'">'+esc(i.candidatePhone)+'</a>');
  if(i.candidateLinkedin){
    var l = safeUrl(/^(www\.)?linkedin\.com/i.test(i.candidateLinkedin.trim()) ? 'https://'+i.candidateLinkedin.trim() : i.candidateLinkedin, 'https://www.linkedin.com/in/');
    parts.push(l ? '<a href="'+esc(l)+'" target="_blank" rel="noopener">LinkedIn</a>' : 'LinkedIn: '+esc(i.candidateLinkedin));
  }
  if(i.candidateInstagram){
    var ig = safeUrl(i.candidateInstagram, 'https://www.instagram.com/');
    parts.push(ig ? '<a href="'+esc(ig)+'" target="_blank" rel="noopener">Instagram '+esc(i.candidateInstagram)+'</a>' : 'Instagram: '+esc(i.candidateInstagram));
  }
  if(i.candidateCompany) parts.push('Empresa: '+esc(i.candidateCompany));
  if(!parts.length) return '';
  return '<div class="card" style="margin-top:14px;padding:14px 18px"><div class="mono" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--idl-text-muted);margin-bottom:6px">Contato</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px">'+parts.join('')+'</div></div>';
}

function aiBannerHtml(ai){
  var st = ai.status || 'none', msg, btn = 'Gerar feedback da IA', extra = '';
  if(st === 'pending'){
    return '<div class="card" style="margin-top:14px"><div class="spinner-line"><span class="spinner-dot"></span><span class="spinner-dot"></span><span class="spinner-dot"></span> Gerando o feedback da IA, pode levar até 1 minuto…</div></div>';
  }
  if(st === 'ready'){ msg = 'Feedback da IA gerado'+(ai.generatedAt?' em '+fmtDate(ai.generatedAt):'')+'.'; btn = 'Gerar de novo'; }
  else if(st === 'error'){ msg = 'A IA não conseguiu gerar o feedback.'; extra = ai.error ? '<p class="hint" style="margin-top:6px">Motivo: '+esc(String(ai.error).slice(0,250))+'</p>' : ''; }
  else if(st === 'unavailable'){ msg = 'Feedback da IA ainda não foi gerado (o backend não tinha a chave da IA quando a simulação foi enviada).'; }
  else { msg = 'Feedback da IA ainda não foi gerado.'; }
  return '<div class="card" style="margin-top:14px"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
    '<div style="flex:1;min-width:200px;font-size:13.5px">🤖 '+msg+'</div>'+
    '<button class="btn-secondary" onclick="Especialista.retryAi()">'+btn+'</button></div>'+extra+'</div>';
}

const Especialista = {
  retryAi: async function(){
    // Atualiza só o bloco da IA: não mexe nos campos que a especialista está digitando.
    currentInterview.aiFeedback = {status:'pending'};
    refreshAi();
    try{ await Api.post('retryAiFeedback', {id: currentInterview.id}); }catch(e){}
    try{ currentInterview = await Api.getInterview(currentInterview.id); }catch(e){}
    refreshAi();
    var st = currentInterview.aiFeedback && currentInterview.aiFeedback.status;
    toast(st === 'ready' ? 'Feedback da IA gerado.' : 'A IA não gerou o feedback. Veja o motivo no topo da página.');
  },
  saveOne: async function(qid){
    const text = document.getElementById('sf-'+qid).value||'';
    const name = specialistName() || 'Especialista';
    try{
      await Api.post('saveSpecialistFeedback', {id: currentInterview.id, qid: qid, text: text, specialistName: name});
      const sf = currentInterview.specialistFeedback || {byQuestion:{}, overall:null};
      sf.byQuestion[qid] = {text:text, specialistName:name, updatedAt:new Date().toISOString()};
      currentInterview.specialistFeedback = sf;
      toast('Feedback salvo.');
    }catch(err){ toast('Erro: ' + err.message); }
  },
  saveOverall: async function(){
    const text = document.getElementById('sf-overall').value||'';
    const name = specialistName() || 'Especialista';
    try{
      await Api.post('saveOverallFeedback', {id: currentInterview.id, text: text, specialistName: name});
      toast('Comentário geral salvo.');
    }catch(err){ toast('Erro: ' + err.message); }
  },
  complete: async function(){
    const name = specialistName() || 'Especialista';
    try{
      await Api.post('completeReview', {id: currentInterview.id, specialistName: name});
      currentInterview.status = 'avaliado';
      renderDetail();
      toast('Avaliação concluída.');
    }catch(err){ toast('Erro: ' + err.message); }
  },
  reopen: async function(){
    try{
      await Api.post('reopenReview', {id: currentInterview.id});
      currentInterview.status = 'submetido';
      renderDetail();
      toast('Avaliação reaberta.');
    }catch(err){ toast('Erro: ' + err.message); }
  }
};

boot();
</script>
</body>
</html>
