<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrevista de Alto Impacto · Responder</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Cormorant+Garamond:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=202610052039">
</head>
<body>
<div class="bg"></div>
<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img class="logo-mark" src="logo.svg" alt="Entrevista de Alto Impacto">
      <div>
        <div class="brand-name">Entrevista de Alto Impacto</div>
        <div class="brand-sub"><img class="idealizadora-avatar" src="franciane-novais.jpg" alt="Franciane Novais">Idealizadora <b>Franciane Novais</b><br>Venture desenvolvida em parceria com o Instituto da Liderança</div>
      </div>
    </a>
    <div class="tabs" id="tabs"></div>
  </div>
</div>
<div id="app"></div>
<div id="toast-host"></div>
<script src="app.js?v=202610052039"></script>
<script>
"use strict";
renderNav('responder');

const CANDIDATE_ID = qs('id');
let currentInterview = null;
let qIndex = 0;
let pollTimer = null;

function firstUnansweredIndex(interview){
  var snap = interview.questionsSnapshot;
  for(var i=0;i<snap.length;i++){
    var a = interview.answers[snap[i].qid];
    if(!a || !String(a.text||'').trim()) return i;
  }
  return snap.length-1;
}

async function boot(){
  if(!CANDIDATE_ID){ await renderStart(); return; }
  document.getElementById('app').innerHTML = loadingHtml('Carregando sua simulação…');
  try{
    const interview = await Api.getInterview(CANDIDATE_ID);
    if(!interview){ document.getElementById('app').innerHTML = '<div class="wrap"><div class="empty">Simulação não encontrada. Confira o link.</div></div>'; return; }
    currentInterview = interview;
    if(interview.status === 'em_andamento'){
      qIndex = firstUnansweredIndex(interview);
      renderAnswering();
    } else {
      renderResults();
      maybePoll();
    }
  }catch(err){
    document.getElementById('app').innerHTML = errorHtml(err);
  }
}

// ---------------- início / nova simulação ----------------
let _perfil = null, _blocos = [], _perguntas = [];

async function renderStart(){
  const app = document.getElementById('app');
  const auth = getAuth();
  if(!auth || auth.role !== 'respondente'){ renderAuthPanel(auth); return; }
  app.innerHTML = loadingHtml('Carregando…');
  try{
    const r = await Promise.all([Api.me(), Api.listBlocks(), Api.listQuestionsFast(function(rows){ _perguntas = rows; })]);
    _perfil = r[0].profile; _blocos = r[1]; _perguntas = r[2];
  }catch(err){ app.innerHTML = errorHtml(err); return; }
  renderChoose();
}

function perguntasDoBloco(b){
  const mapa = {}; _perguntas.forEach(function(q){ mapa[q.id] = q; });
  return b.questionIds.map(function(id){ return mapa[id]; }).filter(Boolean);
}
function opcoesDeBloco(){
  if(_blocos.length) return _blocos.map(function(b){ return {id:b.id, name:b.name, description:b.description, qs: perguntasDoBloco(b)}; })
                                  .filter(function(o){ return o.qs.length; });
  const ativas = _perguntas.filter(function(q){ return q.ativa; }).sort(function(a,b){ return (a.order||0)-(b.order||0); });
  return ativas.length ? [{id:'', name:'Simulação padrão', description:'', qs: ativas}] : [];
}

function renderChoose(){
  const app = document.getElementById('app'), opts = opcoesDeBloco(), p = _perfil;
  const cards = opts.map(function(o, i){
    return '<label class="bloco-opt"><input type="radio" name="bloco" value="'+esc(o.id)+'" '+(i===0?'checked':'')+'>'+
      '<span><b>'+esc(o.name)+'</b><small>'+o.qs.length+' pergunta'+(o.qs.length===1?'':'s')+(o.description?' · '+esc(o.description):'')+'</small></span></label>';
  }).join('');
  app.innerHTML =
    '<div class="wrap">'+
      '<div class="hero"><h1>Olá, '+esc((p.name||'').split(' ')[0])+'</h1>'+
      '<p>Escolha o bloco de perguntas e comece. Seus dados já estão no seu perfil.</p></div>'+
      '<div class="card">'+
        (opts.length ? '<div class="field"><label>Bloco de perguntas</label><div class="bloco-list">'+cards+'</div></div>'+
          '<div class="field"><label>Cargo / função pretendida nesta simulação</label><input id="r-cargo" value="'+esc(p.role||'')+'" placeholder="Ex: Analista de RH Pleno"></div>'+
          '<button class="btn-primary" id="r-start-btn" onclick="Responder.start()">Iniciar simulação</button>'
          : '<p class="hint">Nenhum bloco de perguntas está disponível no momento. Volte mais tarde.</p>')+
      '</div>'+
      '<p class="hint" style="margin-top:14px">Suas simulações anteriores ficam em <a href="conta.html" style="color:var(--idl-purple);font-weight:600">Minha conta</a>.</p>'+
    '</div>';
}

// Cadastro / entrada de quem ainda não está logado
function renderAuthPanel(auth){
  const app = document.getElementById('app');
  const aviso = auth ? '<p class="hint" style="margin-bottom:12px">Você está com uma sessão da equipe ('+esc(ROTULO_PERFIL[auth.role]||auth.role)+'). Para responder, crie ou entre com uma conta de participante: isso encerra a sessão da equipe neste navegador.</p>' : '';
  app.innerHTML =
    '<div class="wrap">'+
      '<div class="hero"><h1>Entrevista de Alto Impacto</h1>'+
      '<p>Crie sua conta uma vez e faça quantas simulações quiser. Seus dados e seu histórico ficam guardados no seu perfil.</p></div>'+
      '<div class="card">'+aviso+
        '<div class="seg"><button id="seg-novo" class="on" onclick="mostraAba(\'novo\')">Criar conta</button><button id="seg-entrar" onclick="mostraAba(\'entrar\')">Já tenho conta</button></div>'+
        '<form id="f-novo" class="form-grid" style="margin-top:16px">'+
          '<div class="field full"><label>Nome completo *</label><input id="c-nome" autocomplete="name" required placeholder="Ex: Maria Silva"></div>'+
          '<div class="field"><label>E-mail *</label><input id="c-email" type="email" autocomplete="email" required placeholder="maria@email.com"></div>'+
          '<div class="field"><label>Telefone</label><input id="c-tel" type="tel" autocomplete="tel" placeholder="(11) 99999-0000"></div>'+
          '<div class="field"><label>Senha * (mínimo 8 caracteres)</label><input id="c-senha" type="password" autocomplete="new-password" required></div>'+
          '<div class="field"><label>Repita a senha *</label><input id="c-senha2" type="password" autocomplete="new-password" required></div>'+
          '<div class="field"><label>LinkedIn</label><input id="c-linkedin" placeholder="linkedin.com/in/seu-perfil"></div>'+
          '<div class="field"><label>Instagram</label><input id="c-insta" placeholder="@seuusuario"></div>'+
          '<div class="field"><label>Empresa</label><input id="c-empresa" autocomplete="organization" placeholder="Empresa onde você trabalha"></div>'+
          '<div class="field"><label>Cargo / função pretendida</label><input id="c-cargo" placeholder="Ex: Analista de RH Pleno"></div>'+
          '<div class="full"><button class="btn-primary" id="c-btn" type="submit">Criar conta e continuar</button><p class="hint" id="c-msg" style="margin-top:10px;min-height:18px"></p></div>'+
        '</form>'+
        '<form id="f-entrar" style="display:none;margin-top:16px;max-width:380px">'+
          '<div class="field"><label>E-mail</label><input id="e-email" type="email" autocomplete="username" required></div>'+
          '<div class="field"><label>Senha</label><input id="e-senha" type="password" autocomplete="current-password" required></div>'+
          '<button class="btn-primary" id="e-btn" type="submit">Entrar</button>'+
          '<p class="hint" id="e-msg" style="margin-top:10px;min-height:18px"></p>'+
          '<p class="hint"><a href="#" onclick="openLoginModal(\'esqueci\');return false" style="color:var(--idl-purple);font-weight:600">Esqueci minha senha</a></p>'+
        '</form>'+
      '</div>'+
    '</div>';
  document.getElementById('f-novo').addEventListener('submit', criarConta);
  document.getElementById('f-entrar').addEventListener('submit', entrarConta);
}
function mostraAba(qual){
  document.getElementById('f-novo').style.display = qual==='novo' ? '' : 'none';
  document.getElementById('f-entrar').style.display = qual==='entrar' ? 'block' : 'none';
  document.getElementById('seg-novo').className = qual==='novo' ? 'on' : '';
  document.getElementById('seg-entrar').className = qual==='entrar' ? 'on' : '';
}
async function criarConta(ev){
  ev.preventDefault();
  const v = function(id){ return document.getElementById(id).value.trim(); }, msg = document.getElementById('c-msg'), btn = document.getElementById('c-btn');
  if(document.getElementById('c-senha').value !== document.getElementById('c-senha2').value){ msg.textContent = 'As senhas não são iguais.'; return; }
  btn.disabled = true; btn.textContent = 'Criando…'; msg.textContent = '';
  try{
    await Api.register({name:v('c-nome'), email:v('c-email'), password:document.getElementById('c-senha').value, phone:v('c-tel'),
      linkedin:v('c-linkedin'), instagram:v('c-insta'), company:v('c-empresa'), role:v('c-cargo')});
    location.reload();
  }catch(err){ msg.textContent = err.message; btn.disabled = false; btn.textContent = 'Criar conta e continuar'; }
}
async function entrarConta(ev){
  ev.preventDefault();
  const msg = document.getElementById('e-msg'), btn = document.getElementById('e-btn');
  btn.disabled = true; btn.textContent = 'Entrando…'; msg.textContent = '';
  try{ await Api.login('respondente', document.getElementById('e-email').value, document.getElementById('e-senha').value); location.reload(); }
  catch(err){ msg.textContent = err.message; btn.disabled = false; btn.textContent = 'Entrar'; }
}

const Responder = {
  start: async function(){
    const sel = document.querySelector('input[name="bloco"]:checked');
    const opt = opcoesDeBloco().filter(function(o){ return sel && o.id === sel.value; })[0];
    if(!opt){ toast('Escolha um bloco de perguntas.'); return; }
    const cargo = (document.getElementById('r-cargo').value||'').trim();
    const btn = document.getElementById('r-start-btn');
    btn.disabled = true; btn.textContent = 'Iniciando…';
    const snapshot = opt.qs.map(function(q, i){ return {qid:q.id, text:q.text, tipo:q.tipo, orientacao:q.orientacao||'', aiGuidance:q.aiGuidance||'', order:i+1}; });
    const id = uid();
    try{
      // Dados pessoais vêm do perfil (o servidor usa o que está guardado na conta).
      await Api.post('createInterview', {id:id, candidateName:_perfil.name, targetRole:cargo, questionsSnapshot:snapshot, createdAt:new Date().toISOString(), blockId:opt.id});
      for(let i=0;i<10;i++){
        await sleep(1200);
        const r = await Api.getInterview(id).catch(function(){ return null; });
        if(r){ location.href = 'responder.html?id=' + encodeURIComponent(id); return; }
      }
      toast('Não foi possível iniciar. Tente de novo.');
    }catch(err){ toast('Erro ao iniciar: ' + err.message); }
    btn.disabled = false; btn.textContent = 'Iniciar simulação';
  },
  next: function(){ saveCurrentAnswer(); if(qIndex < currentInterview.questionsSnapshot.length-1){ qIndex++; } renderAnswering(); },
  prev: function(){ saveCurrentAnswer(); if(qIndex>0){ qIndex--; } renderAnswering(); },
  finish: async function(){
    saveCurrentAnswer();
    const snap = currentInterview.questionsSnapshot;
    const blanks = snap.filter(function(s){ return !String((currentInterview.answers[s.qid]||{}).text||'').trim(); }).length;
    if(blanks>0 && !confirm('Você deixou '+blanks+' pergunta(s) em branco. Concluir mesmo assim?')) return;
    const app = document.getElementById('app');
    app.innerHTML = '<div class="wrap"><div class="card" style="text-align:center;padding:50px 30px">'+
      '<h2>Enviando suas respostas…</h2>'+
      '<p class="muted" style="margin-top:10px">Gerando o feedback automático da IA. Isso pode levar até 1 minuto.</p>'+
      '<div class="spinner-line" style="justify-content:center;margin-top:16px"><span class="spinner-dot"></span><span class="spinner-dot"></span><span class="spinner-dot"></span></div>'+
      '</div></div>';
    try{
      await Api.post('finishInterview', {id: currentInterview.id, answers: currentInterview.answers});
    }catch(err){ /* segue mesmo assim: o poll abaixo confirma o estado real */ }
    try{
      currentInterview = await Api.getInterview(currentInterview.id);
    }catch(err){}
    renderResults();
    maybePoll();
  },
  retryAi: async function(){
    currentInterview.aiFeedback = {status:'pending'};
    renderResults();
    try{ await Api.post('retryAiFeedback', {id: currentInterview.id}); }catch(e){}
    currentInterview = await Api.getInterview(currentInterview.id).catch(function(){ return currentInterview; });
    renderResults();
    var st = currentInterview.aiFeedback && currentInterview.aiFeedback.status;
    if(st === 'unavailable') toast('A IA continua indisponível: o backend não encontrou a chave configurada.');
    else if(st === 'error') toast('A IA não respondeu. Veja o motivo no bloco do feedback.');
    maybePoll();
  },
  copyLink: function(){
    const url = location.origin + location.pathname.replace(/responder\.html$/,'') + 'responder.html?id=' + encodeURIComponent(currentInterview.id);
    if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){ toast('Link copiado.'); }); }
    else toast(url);
  }
};

function saveCurrentAnswer(){
  const q = currentInterview.questionsSnapshot[qIndex];
  const el = document.getElementById('ans-'+q.qid);
  if(!el) return;
  const val = el.value||'';
  currentInterview.answers[q.qid] = {text:val, answeredAt:new Date().toISOString()};
  Api.post('saveAnswer', {id: currentInterview.id, qid: q.qid, text: val}).catch(function(){});
}

function renderAnswering(){
  const app = document.getElementById('app');
  const snap = currentInterview.questionsSnapshot;
  const q = snap[qIndex];
  const existing = (currentInterview.answers[q.qid] && currentInterview.answers[q.qid].text) || '';
  const isLast = qIndex === snap.length-1;
  app.innerHTML =
    '<div class="wrap">'+
      '<div class="qcounter">Pergunta '+(qIndex+1)+' de '+snap.length+' · '+esc(currentInterview.candidateName)+'</div>'+
      '<div class="progress-bar"><div class="progress-fill" style="width:'+Math.round((qIndex/snap.length)*100)+'%"></div></div>'+
      '<div class="card">'+
        '<div class="qbig">'+esc(q.text)+'</div>'+
        '<textarea id="ans-'+q.qid+'" rows="7" placeholder="Digite sua resposta como se estivesse numa entrevista real…">'+esc(existing)+'</textarea>'+
        '<div class="nav-row">'+
          '<button class="btn-secondary" '+(qIndex===0?'disabled':'')+' onclick="Responder.prev()">← Voltar</button>'+
          (isLast ? '<button class="btn-primary" onclick="Responder.finish()">Concluir simulação</button>' :
                    '<button class="btn-primary" onclick="Responder.next()">Próxima →</button>')+
        '</div>'+
      '</div>'+
    '</div>';
}

function renderResults(){
  const app = document.getElementById('app');
  const interview = currentInterview;
  const snap = interview.questionsSnapshot;
  const ai = interview.aiFeedback || {status:'none'};
  const spec = (interview.specialistFeedback && interview.specialistFeedback.byQuestion) || {};

  const cards = snap.map(function(q, i){
    const ans = (interview.answers[q.qid] && interview.answers[q.qid].text) || '';
    const meta = TIPO_META[q.tipo] || TIPO_META.direta;
    const aiText = ai.byQuestion && ai.byQuestion[q.qid];
    let aiBlock;
    if(ai.status==='pending') aiBlock = '<div class="spinner-line"><span class="spinner-dot"></span><span class="spinner-dot"></span><span class="spinner-dot"></span> Gerando feedback automático…</div>';
    else if(ai.status==='unavailable') aiBlock = '<p class="muted">Feedback automático da IA indisponível no momento. <button class="btn-ghost" onclick="Responder.retryAi()">Tentar novamente</button></p>';
    else if(ai.status==='error') aiBlock = '<p class="muted">Não foi possível gerar o feedback automático. <button class="btn-ghost" onclick="Responder.retryAi()">Tentar novamente</button></p>'+(ai.error?'<p class="hint">Motivo: '+esc(String(ai.error).slice(0,200))+'</p>':'');
    else if(aiText) aiBlock = '<p>'+nl2br(aiText)+'</p>';
    else aiBlock = '<p class="muted">-</p>';

    const specEntry = spec[q.qid];
    const specBlock = specEntry ? '<p>'+nl2br(specEntry.text)+'</p>' : '<p class="muted">Ainda não avaliado pela especialista.</p>';

    return '<div class="rescard">'+
      '<div class="qn">Pergunta '+(i+1)+' de '+snap.length+' · <span class="badge muted" style="margin-left:4px">'+esc(meta.short)+'</span></div>'+
      '<h3>'+esc(q.text)+'</h3>'+
      '<div class="res-block answer"><div class="lbl">Sua resposta</div><p>'+nl2br(ans||'(em branco)')+'</p></div>'+
      '<div class="res-block orient"><div class="lbl">💡 Como responder melhor</div><p>'+nl2br(q.orientacao||'-')+'</p>'+
        (q.tipo==='star'?starLegendHtml():'')+
      '</div>'+
      '<div class="res-block ai"><div class="lbl">🤖 Feedback automático da IA</div>'+aiBlock+'</div>'+
      '<div class="res-block specialist"><div class="lbl">🧑‍🏫 Feedback da especialista</div>'+specBlock+'</div>'+
    '</div>';
  }).join('');

  const st = STATUS_META[interview.status]||{};
  app.innerHTML =
    '<div class="wrap">'+
      '<div class="section-title"><h2>Resultado da simulação</h2><span class="badge '+st.cls+'">'+st.label+'</span></div>'+
      '<p class="hint">'+esc(interview.candidateName)+(interview.targetRole?' · '+esc(interview.targetRole):'')+' · enviado em '+fmtDate(interview.submittedAt)+'</p>'+
      '<div class="divider"></div>'+
      cards+
      '<div class="nav-row">'+
        '<button class="btn-secondary" onclick="Responder.copyLink()">Copiar link desta simulação</button>'+
        '<a class="btn-primary" style="display:inline-block;text-align:center" href="relatorio.html?id='+encodeURIComponent(interview.id)+'">Ver relatório completo →</a>'+
      '</div>'+
    '</div>';
}

function maybePoll(){
  if(pollTimer) clearInterval(pollTimer);
  let tries = 0;
  const needsPoll = function(){
    return currentInterview && (
      (currentInterview.aiFeedback && currentInterview.aiFeedback.status === 'pending') ||
      currentInterview.status === 'submetido'
    );
  };
  if(!needsPoll()) return;
  pollTimer = setInterval(async function(){
    tries++;
    if(tries > 40 || !needsPoll()){ clearInterval(pollTimer); return; }
    try{
      const fresh = await Api.getInterview(currentInterview.id);
      if(fresh){ currentInterview = fresh; renderResults(); if(!needsPoll()) clearInterval(pollTimer); }
    }catch(e){}
  }, 6000);
}

boot();
</script>
</body>
</html>
